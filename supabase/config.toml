# Supabase local/project config. Run `supabase link --project-ref <ref>`
# then `supabase db push` to apply migrations.
project_id = "aptitude-app"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "aptitude://"
# Email/password sign-in for the MVP.
[auth.email]
enable_signup = true
enable_confirmations = false

[functions.daily-question]
verify_jwt = true
[functions.submit-answer]
verify_jwt = true
[functions.send-daily-push]
verify_jwt = false
